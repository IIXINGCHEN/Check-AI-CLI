name: verify-checksums

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify checksums
        shell: pwsh
        run: |
          ./tools/Update-Checksums.ps1 -Check
